<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #2c3e50; font-weight: 500; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a252f; }
      .pin-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #ffffff; font-weight: bold; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#fcfcfc" rx="8"/>
  <rect x="10" y="10" width="800" height="440" fill="none" stroke="#e1e8ed" stroke-width="1.5" rx="6"/>

  <!-- ESP32 Board Graphic -->
  <g transform="translate(50, 70)" filter="url(#shadow)">
    <rect width="150" height="270" rx="8" fill="#1e272e"/>
    <rect x="20" y="55" width="110" height="85" rx="4" fill="#d2dae2" stroke="#808e9b" stroke-width="1.5"/>
    <text x="75" y="95" text-anchor="middle" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#485460">ESP32-WROOM</text>
    <text x="75" y="112" text-anchor="middle" font-family="sans-serif" font-size="9px" fill="#808e9b">WiFi + BLE SoC</text>
    <circle cx="110" cy="75" r="4" fill="#b0bec5"/>
    <rect x="30" y="10" width="90" height="32" rx="3" fill="#000000"/>
    <path d="M 40 38 L 40 20 L 50 20 L 50 35 L 60 35 L 60 20 L 70 20 L 70 35 L 80 35 L 80 20 L 90 20 L 90 35 L 100 35 L 100 20 L 110 20 L 110 38" fill="none" stroke="#f1c40f" stroke-width="2"/>
    <rect x="50" y="250" width="50" height="24" rx="3" fill="#718093" stroke="#2f3640" stroke-width="1"/>
    
    <g fill="#f5f6fa" stroke="#7f8fa6">
      <circle cx="12" cy="70" r="4.5"/><circle cx="12" cy="90" r="4.5"/><circle cx="12" cy="110" r="4.5"/>
      <circle cx="12" cy="130" r="4.5"/><circle cx="12" cy="150" r="4.5"/><circle cx="12" cy="170" r="4.5"/>
      <circle cx="12" cy="190" r="4.5"/><circle cx="12" cy="210" r="4.5"/><circle cx="12" cy="230" r="4.5"/>
      <circle cx="138" cy="70" r="4.5"/><circle cx="138" cy="90" r="4.5"/><circle cx="138" cy="110" r="4.5"/>
      <circle cx="138" cy="130" r="4.5"/><circle cx="138" cy="150" r="4.5"/><circle cx="138" cy="170" r="4.5"/>
      <circle cx="138" cy="190" r="4.5"/><circle cx="138" cy="210" r="4.5"/><circle cx="138" cy="230" r="4.5"/>
    </g>
    <text x="75" y="240" text-anchor="middle" class="pin-label" fill="#f5cd79">ESP32 DevKit</text>
  </g>

  <!-- Pin Callouts -->
  <!-- GPIO 4 (Right, cy=130 -> absolute 200) -->
  <g transform="translate(190, 190)">
    <rect width="65" height="20" rx="3" fill="#0984e3"/>
    <text x="32" y="14" text-anchor="middle" class="pin-label">GPIO 4</text>
  </g>
  <!-- GPIO 5 (Right, cy=150 -> absolute 220) -->
  <g transform="translate(190, 215)">
    <rect width="65" height="20" rx="3" fill="#00b894"/>
    <text x="32" y="14" text-anchor="middle" class="pin-label">GPIO 5</text>
  </g>
  <!-- GND (Left, cy=190 -> absolute 260) -->
  <g transform="translate(5, 250)">
    <rect width="45" height="20" rx="3" fill="#2f3640"/>
    <text x="22" y="14" text-anchor="middle" class="pin-label">GND</text>
  </g>

  <!-- L9110S / DRV8833 Motor Driver Module Graphic -->
  <g transform="translate(340, 170)" filter="url(#shadow)">
    <!-- PCB -->
    <rect width="170" height="150" rx="6" fill="#1b4f72" stroke="#154360" stroke-width="2"/>
    <text x="85" y="25" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#ecf0f1">L9110S Motor Driver</text>
    
    <!-- IC Chip -->
    <rect x="55" y="45" width="60" height="35" rx="3" fill="#2c3e50" stroke="#1a252f"/>
    <circle cx="65" cy="53" r="2" fill="#7f8c8d"/>
    <text x="85" y="66" text-anchor="middle" font-size="9px" fill="#ecf0f1" font-weight="bold">L9110S</text>

    <!-- Logic Input Header (Left) -->
    <g transform="translate(10, 95)">
      <circle cx="10" cy="8" r="4" fill="#f1c40f"/>
      <circle cx="10" cy="22" r="4" fill="#f1c40f"/>
      <circle cx="10" cy="36" r="4" fill="#c0392b"/>
      <circle cx="10" cy="50" r="4" fill="#2c3e50"/>
      <text x="20" y="12" font-size="10px" font-weight="bold" fill="#ecf0f1">A-IA (FWD)</text>
      <text x="20" y="26" font-size="10px" font-weight="bold" fill="#ecf0f1">A-IB (REV)</text>
      <text x="20" y="40" font-size="10px" font-weight="bold" fill="#ff7675">VCC (5~12V)</text>
      <text x="20" y="54" font-size="10px" font-weight="bold" fill="#bdc3c7">GND (접지)</text>
    </g>

    <!-- Motor Output Terminal Block (Right) -->
    <g transform="translate(130, 45)">
      <!-- Green Screw Terminal -->
      <rect width="32" height="50" rx="3" fill="#27ae60" stroke="#1e8449"/>
      <circle cx="16" cy="15" r="5" fill="#f1c40f"/>
      <circle cx="16" cy="35" r="5" fill="#f1c40f"/>
      <text x="-4" y="19" text-anchor="end" font-size="9px" font-weight="bold" fill="#ecf0f1">MOTOR A</text>
    </g>
  </g>

  <!-- DC Motor Graphic -->
  <g transform="translate(620, 185)" filter="url(#shadow)">
    <!-- Motor Metal Can Body -->
    <rect width="90" height="70" rx="10" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
    <!-- Back Plastic Cap -->
    <rect x="-8" y="10" width="8" height="50" rx="2" fill="#e74c3c"/>
    <!-- Output Shaft -->
    <rect x="90" y="30" width="30" height="10" fill="#95a5a6" stroke="#7f8c8d"/>
    <text x="45" y="40" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12px" fill="#2c3e50">DC 모터</text>
    <!-- Terminals -->
    <circle cx="-3" cy="20" r="3" fill="#f1c40f"/>
    <circle cx="-3" cy="50" r="3" fill="#f1c40f"/>
  </g>

  <!-- External Battery Box -->
  <g transform="translate(420, 350)" filter="url(#shadow)">
    <rect width="110" height="60" rx="5" fill="#34495e" stroke="#2c3e50"/>
    <text x="55" y="30" text-anchor="middle" font-size="11px" font-weight="bold" fill="#ecf0f1">외부 배터리</text>
    <text x="55" y="46" text-anchor="middle" font-size="10px" fill="#f1c40f">4.5V ~ 6V</text>
    <!-- Battery Terminals -->
    <rect x="15" y="-6" width="10" height="8" fill="#e74c3c"/>
    <rect x="85" y="-6" width="10" height="8" fill="#2c3e50"/>
    <text x="20" y="-10" text-anchor="middle" font-size="10px" font-weight="bold" fill="#e74c3c">+</text>
    <text x="90" y="-10" text-anchor="middle" font-size="10px" font-weight="bold" fill="#2c3e50">-</text>
  </g>

  <!-- Wires -->
  <!-- GPIO 4 -> Driver A-IA (Forward) -->
  <path d="M 255 200 L 350 200 L 350 273" fill="none" stroke="#0984e3" stroke-width="3" stroke-linecap="round"/>
  <!-- GPIO 5 -> Driver A-IB (Reverse) -->
  <path d="M 255 225 L 340 225 L 340 287 L 350 287" fill="none" stroke="#00b894" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Battery + to Driver VCC -->
  <path d="M 440 344 L 440 310 L 350 310" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <!-- Common Ground: Battery - to Driver GND and ESP32 GND -->
  <path d="M 510 344 L 510 324 L 350 324" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 260 L 25 260 L 25 430 L 510 430 L 510 344" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Motor Terminal Wires -->
  <path d="M 486 230 L 617 205" fill="none" stroke="#f39c12" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 486 250 L 617 235" fill="none" stroke="#d35400" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Info Box -->
  <g transform="translate(360, 40)">
    <rect width="430" height="90" rx="6" fill="#f8f9fa" stroke="#ced6e0" stroke-width="1"/>
    <text x="15" y="24" class="title" font-size="14px">DC 모터 및 드라이버 연결도</text>
    <circle cx="22" cy="44" r="5" fill="#0984e3"/>
    <text x="35" y="48" class="label" font-size="11.5px">GPIO 4 (정회전 Forward) → 드라이버 A-IA</text>
    <circle cx="22" cy="58" r="5" fill="#00b894"/>
    <text x="35" y="62" class="label" font-size="11.5px">GPIO 5 (역회전 Backward) → 드라이버 A-IB</text>
    <circle cx="22" cy="72" r="5" fill="#2c3e50"/>
    <text x="35" y="76" class="label" font-size="11.5px">GND (공통 접지 Common Ground) → ESP32 GND &amp; 배터리 음극(-)</text>
  </g>
</svg>

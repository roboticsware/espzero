<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #2c3e50; font-weight: 500; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a252f; }
      .pin-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #ffffff; font-weight: bold; }
      .wire-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fcfcfc" rx="8"/>
  <rect x="10" y="10" width="730" height="400" fill="none" stroke="#e1e8ed" stroke-width="1.5" rx="6"/>

  <!-- ESP32 Board Graphic -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- PCB Board -->
    <rect width="160" height="280" rx="8" fill="#1e272e"/>
    <!-- ESP32 Metal Shield -->
    <rect x="25" y="60" width="110" height="90" rx="4" fill="#d2dae2" stroke="#808e9b" stroke-width="1.5"/>
    <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#485460">ESP32-WROOM</text>
    <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="9px" fill="#808e9b">WiFi + BLE SoC</text>
    <circle cx="115" cy="80" r="4" fill="#b0bec5"/>
    
    <!-- Onboard Antenna area -->
    <rect x="35" y="10" width="90" height="35" rx="3" fill="#000000"/>
    <path d="M 45 40 L 45 20 L 55 20 L 55 35 L 65 35 L 65 20 L 75 20 L 75 35 L 85 35 L 85 20 L 95 20 L 95 35 L 105 35 L 105 20 L 115 20 L 115 40" fill="none" stroke="#f1c40f" stroke-width="2"/>
    
    <!-- MicroUSB Port -->
    <rect x="55" y="260" width="50" height="24" rx="3" fill="#718093" stroke="#2f3640" stroke-width="1"/>
    
    <!-- Pin Headers Left -->
    <g fill="#f5f6fa" stroke="#7f8fa6">
      <circle cx="12" cy="70" r="4.5"/>
      <circle cx="12" cy="90" r="4.5"/>
      <circle cx="12" cy="110" r="4.5"/>
      <circle cx="12" cy="130" r="4.5"/>
      <circle cx="12" cy="150" r="4.5"/>
      <circle cx="12" cy="170" r="4.5"/>
      <circle cx="12" cy="190" r="4.5"/>
      <circle cx="12" cy="210" r="4.5"/>
      <circle cx="12" cy="230" r="4.5"/>
    </g>
    <!-- Pin Headers Right -->
    <g fill="#f5f6fa" stroke="#7f8fa6">
      <circle cx="148" cy="70" r="4.5"/>
      <circle cx="148" cy="90" r="4.5"/>
      <circle cx="148" cy="110" r="4.5"/>
      <circle cx="148" cy="130" r="4.5"/>
      <circle cx="148" cy="150" r="4.5"/>
      <circle cx="148" cy="170" r="4.5"/>
      <circle cx="148" cy="190" r="4.5"/>
      <circle cx="148" cy="210" r="4.5"/>
      <circle cx="148" cy="230" r="4.5"/>
    </g>

    <!-- Board Name -->
    <text x="80" y="248" text-anchor="middle" class="pin-label" fill="#f5cd79">ESP32 DevKit</text>
  </g>

  <!-- Pin Out Callouts -->
  <!-- GPIO 4 (Right side, cy=130 -> absolute 190) -->
  <g transform="translate(208, 180)">
    <rect width="65" height="20" rx="3" fill="#0097e6"/>
    <text x="32" y="14" text-anchor="middle" class="pin-label">GPIO 4</text>
  </g>
  <!-- GND (Left side, cy=190 -> absolute 250) -->
  <g transform="translate(8, 240)">
    <rect width="50" height="20" rx="3" fill="#2f3640"/>
    <text x="25" y="14" text-anchor="middle" class="pin-label">GND</text>
  </g>

  <!-- Wires -->
  <!-- Wire GPIO 4 (Blue/Signal) to 220 Ohm Resistor -->
  <path d="M 273 190 L 370 190" fill="none" stroke="#00a8ff" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Resistor 220 ohm -->
  <g transform="translate(370, 180)">
    <!-- Leads -->
    <line x1="0" y1="10" x2="80" y2="10" stroke="#718093" stroke-width="2.5"/>
    <!-- Body -->
    <rect x="18" y="2" width="44" height="16" rx="4" fill="#f5cd79" stroke="#dcdde1" stroke-width="1"/>
    <!-- Bands (Red, Red, Brown, Gold = 220 Ohm) -->
    <rect x="25" y="2" width="4" height="16" fill="#e84118"/>
    <rect x="33" y="2" width="4" height="16" fill="#e84118"/>
    <rect x="41" y="2" width="4" height="16" fill="#795548"/>
    <rect x="52" y="2" width="4" height="16" fill="#fbc531"/>
    <text x="40" y="-6" text-anchor="middle" class="label" font-size="11px">220 Ω 저항</text>
  </g>

  <!-- Wire Resistor to LED Anode -->
  <path d="M 450 190 L 510 190 L 510 180" fill="none" stroke="#00a8ff" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- LED Graphic -->
  <g transform="translate(485, 120)">
    <!-- Leads -->
    <!-- Anode (Long/Bent Leg, connects to GPIO 4 via resistor) -->
    <path d="M 25 50 L 25 60" fill="none" stroke="#718093" stroke-width="2.5"/>
    <!-- Cathode (Short Leg, connects to GND) -->
    <path d="M 40 50 L 40 180" fill="none" stroke="#718093" stroke-width="2.5"/>
    
    <!-- LED Epoxy Lens Red -->
    <path d="M 15 45 C 15 15, 50 15, 50 45 Z" fill="#ff4757" opacity="0.9" stroke="#e84118" stroke-width="1.5"/>
    <ellipse cx="32.5" cy="45" rx="17.5" ry="4" fill="#ff6b81"/>
    <!-- Glow Highlight -->
    <path d="M 22 25 Q 26 18 35 20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <text x="32" y="-5" text-anchor="middle" class="title" font-size="14px">LED</text>
    <text x="12" y="80" text-anchor="end" class="wire-lbl" fill="#0097e6">애노드 (+)</text>
    <text x="52" y="80" text-anchor="start" class="wire-lbl" fill="#2f3640">캐소드 (-)</text>
  </g>

  <!-- GND Wire from Cathode to ESP32 GND -->
  <!-- Path: from (525, 300) down to 360, left to 40, up to (40, 250) -->
  <path d="M 525 300 L 525 340 L 40 340 L 40 250 L 68 250" fill="none" stroke="#2f3640" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Legend / Info Box -->
  <g transform="translate(370, 40)">
    <rect width="320" height="70" rx="6" fill="#f8f9fa" stroke="#ced6e0" stroke-width="1"/>
    <text x="15" y="26" class="title" font-size="14px">디지털 출력 LED 연결도</text>
    <circle cx="22" cy="48" r="5" fill="#00a8ff"/>
    <text x="35" y="52" class="label" font-size="12px">GPIO 4 → 220Ω 저항 → LED 긴 다리 (애노드 +)</text>
    <circle cx="22" cy="62" r="5" fill="#2f3640"/>
    <text x="35" y="66" class="label" font-size="12px">GND → LED 짧은 다리 / 평평한 면 (캐소드 -)</text>
  </g>
</svg>

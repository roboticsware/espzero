<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #2c3e50; font-weight: 500; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a252f; }
      .pin-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #ffffff; font-weight: bold; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#fcfcfc" rx="8"/>
  <rect x="10" y="10" width="730" height="400" fill="none" stroke="#e1e8ed" stroke-width="1.5" rx="6"/>

  <!-- ESP32 Board Graphic -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <rect width="160" height="280" rx="8" fill="#1e272e"/>
    <rect x="25" y="60" width="110" height="90" rx="4" fill="#d2dae2" stroke="#808e9b" stroke-width="1.5"/>
    <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#485460">ESP32-WROOM</text>
    <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="9px" fill="#808e9b">WiFi + BLE SoC</text>
    <circle cx="115" cy="80" r="4" fill="#b0bec5"/>
    <rect x="35" y="10" width="90" height="35" rx="3" fill="#000000"/>
    <path d="M 45 40 L 45 20 L 55 20 L 55 35 L 65 35 L 65 20 L 75 20 L 75 35 L 85 35 L 85 20 L 95 20 L 95 35 L 105 35 L 105 20 L 115 20 L 115 40" fill="none" stroke="#f1c40f" stroke-width="2"/>
    <rect x="55" y="260" width="50" height="24" rx="3" fill="#718093" stroke="#2f3640" stroke-width="1"/>
    
    <g fill="#f5f6fa" stroke="#7f8fa6">
      <circle cx="12" cy="70" r="4.5"/><circle cx="12" cy="90" r="4.5"/><circle cx="12" cy="110" r="4.5"/>
      <circle cx="12" cy="130" r="4.5"/><circle cx="12" cy="150" r="4.5"/><circle cx="12" cy="170" r="4.5"/>
      <circle cx="12" cy="190" r="4.5"/><circle cx="12" cy="210" r="4.5"/><circle cx="12" cy="230" r="4.5"/>
      <circle cx="148" cy="70" r="4.5"/><circle cx="148" cy="90" r="4.5"/><circle cx="148" cy="110" r="4.5"/>
      <circle cx="148" cy="130" r="4.5"/><circle cx="148" cy="150" r="4.5"/><circle cx="148" cy="170" r="4.5"/>
      <circle cx="148" cy="190" r="4.5"/><circle cx="148" cy="210" r="4.5"/><circle cx="148" cy="230" r="4.5"/>
    </g>
    <text x="80" y="248" text-anchor="middle" class="pin-label" fill="#f5cd79">ESP32 DevKit</text>
  </g>

  <!-- Pin Callouts -->
  <g transform="translate(208, 180)"><rect width="65" height="18" rx="3" fill="#e74c3c"/><text x="32" y="13" text-anchor="middle" class="pin-label">GPIO 4 (R)</text></g>
  <g transform="translate(208, 202)"><rect width="65" height="18" rx="3" fill="#2ecc71"/><text x="32" y="13" text-anchor="middle" class="pin-label">GPIO 5 (G)</text></g>
  <g transform="translate(208, 224)"><rect width="65" height="18" rx="3" fill="#3498db"/><text x="32" y="13" text-anchor="middle" class="pin-label">GPIO 6 (B)</text></g>
  <g transform="translate(8, 240)"><rect width="50" height="20" rx="3" fill="#2f3640"/><text x="25" y="14" text-anchor="middle" class="pin-label">GND</text></g>

  <!-- Resistors (3x 220 Ohm) -->
  <g transform="translate(340, 180)">
    <!-- R1 (Red) -->
    <rect x="0" y="0" width="35" height="12" rx="3" fill="#f5cd79" stroke="#dcdde1"/>
    <line x1="-15" y1="6" x2="0" y2="6" stroke="#718093" stroke-width="2"/>
    <line x1="35" y1="6" x2="60" y2="6" stroke="#718093" stroke-width="2"/>
    <!-- R2 (Green) -->
    <rect x="0" y="22" width="35" height="12" rx="3" fill="#f5cd79" stroke="#dcdde1"/>
    <line x1="-15" y1="28" x2="0" y2="28" stroke="#718093" stroke-width="2"/>
    <line x1="35" y1="28" x2="60" y2="28" stroke="#718093" stroke-width="2"/>
    <!-- R3 (Blue) -->
    <rect x="0" y="44" width="35" height="12" rx="3" fill="#f5cd79" stroke="#dcdde1"/>
    <line x1="-15" y1="50" x2="0" y2="50" stroke="#718093" stroke-width="2"/>
    <line x1="35" y1="50" x2="60" y2="50" stroke="#718093" stroke-width="2"/>
    <text x="18" y="-6" text-anchor="middle" font-size="10px" fill="#7f8c8d">220Ω 저항</text>
  </g>

  <!-- RGB LED (Common Cathode) Graphic -->
  <g transform="translate(480, 140)" filter="url(#shadow)">
    <!-- 4-Lead Pin Layout -->
    <!-- Red Pin -->
    <line x1="20" y1="60" x2="20" y2="180" stroke="#718093" stroke-width="2.5"/>
    <!-- Common Cathode (Longest Pin) -->
    <line x1="32" y1="60" x2="32" y2="210" stroke="#718093" stroke-width="2.5"/>
    <!-- Green Pin -->
    <line x1="44" y1="60" x2="44" y2="180" stroke="#718093" stroke-width="2.5"/>
    <!-- Blue Pin -->
    <line x1="56" y1="60" x2="56" y2="180" stroke="#718093" stroke-width="2.5"/>

    <!-- Clear / Diffused Milky Dome -->
    <path d="M 10 55 C 10 15, 66 15, 66 55 Z" fill="#ecf0f1" opacity="0.85" stroke="#bdc3c7" stroke-width="2"/>
    <ellipse cx="38" cy="55" rx="28" ry="6" fill="#dfe6e9"/>

    <!-- Internal RGB Dies -->
    <circle cx="26" cy="40" r="3.5" fill="#e74c3c"/>
    <circle cx="38" cy="40" r="3.5" fill="#2ecc71"/>
    <circle cx="50" cy="40" r="3.5" fill="#3498db"/>

    <text x="38" y="-10" text-anchor="middle" class="title">RGB LED (Common Cathode)</text>
    <text x="20" y="235" text-anchor="middle" font-size="9px" font-weight="bold" fill="#e74c3c">R</text>
    <text x="32" y="235" text-anchor="middle" font-size="9px" font-weight="bold" fill="#2c3e50">GND</text>
    <text x="44" y="235" text-anchor="middle" font-size="9px" font-weight="bold" fill="#2ecc71">G</text>
    <text x="56" y="235" text-anchor="middle" font-size="9px" font-weight="bold" fill="#3498db">B</text>
  </g>

  <!-- Wires -->
  <!-- GPIO 4 -> R1 -> R pin -->
  <path d="M 273 189 L 325 189" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 400 186 L 500 186 L 500 240" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>

  <!-- GPIO 5 -> R2 -> G pin -->
  <path d="M 273 211 L 325 211 L 325 208" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
  <path d="M 400 208 L 470 208 L 470 260 L 524 260 L 524 240" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>

  <!-- GPIO 6 -> R3 -> B pin -->
  <path d="M 273 233 L 325 233 L 325 230" fill="none" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <path d="M 400 230 L 460 230 L 460 275 L 536 275 L 536 240" fill="none" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>

  <!-- GND -> Longest Pin (Cathode) -->
  <path d="M 68 250 L 40 250 L 40 360 L 512 360 L 512 350" fill="none" stroke="#2f3640" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Info Box -->
  <g transform="translate(360, 40)">
    <rect width="360" height="85" rx="6" fill="#f8f9fa" stroke="#ced6e0" stroke-width="1"/>
    <text x="15" y="24" class="title" font-size="14px">외장 RGB LED (4핀) 연결도</text>
    <circle cx="22" cy="46" r="5" fill="#e74c3c"/>
    <text x="35" y="50" class="label" font-size="12px">GPIO 4 (Red), GPIO 5 (Green), GPIO 6 (Blue)</text>
    <circle cx="22" cy="62" r="5" fill="#f5cd79"/>
    <text x="35" y="66" class="label" font-size="12px">각 RGB 핀에 220Ω 전류 제한 저항 연결</text>
    <circle cx="22" cy="78" r="5" fill="#2f3640"/>
    <text x="35" y="82" class="label" font-size="12px">가장 긴 다리 (공통 음극 Cathode) → GND</text>
  </g>
</svg>

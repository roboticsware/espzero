<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <!-- OLED Module Frame Style -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2634"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .module-pcb { fill: url(#pcbGrad); stroke: #2c3e50; stroke-width: 2; rx: 8px; }
    .header-pins { fill: #f1c40f; stroke: #b7950b; stroke-width: 1; }
    .pin-label { fill: #95a5a6; font-family: monospace; font-size: 7px; text-anchor: middle; }
    .screen-bezel { fill: #050505; stroke: #333; stroke-width: 1.5; rx: 4px; }
    .screen-glass { fill: #0a0e14; }
    .oled-pixel { fill: #38bdf8; filter: url(#glow); }
    .oled-pupil { fill: #0a0e14; }
    .title-text { fill: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .sub-text { fill: #64748b; font-family: monospace; font-size: 11px; text-anchor: middle; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="340" fill="#0f172a" rx="12"/>

  <!-- ==================== 1. NORMAL ==================== -->
  <g transform="translate(30, 20)">
    <!-- OLED Module PCB -->
    <rect width="180" height="120" class="module-pcb"/>
    <!-- Header pins -->
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <!-- Screen Bezel & Display -->
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Eyes: Normal with pupils -->
    <rect x="42" y="48" width="36" height="36" rx="6" class="oled-pixel"/>
    <rect x="54" y="58" width="14" height="14" rx="2" class="oled-pupil"/>
    <rect x="102" y="48" width="36" height="36" rx="6" class="oled-pixel"/>
    <rect x="114" y="58" width="14" height="14" rx="2" class="oled-pupil"/>
    <text x="90" y="132" class="title-text">Normal</text>
    <text x="90" y="146" class="sub-text">"normal"</text>
  </g>

  <!-- ==================== 2. HAPPY ==================== -->
  <g transform="translate(240, 20)">
    <rect width="180" height="120" class="module-pcb"/>
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Eyes: Happy Arch (^ ^) -->
    <path d="M 42 75 Q 60 48 78 75" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 102 75 Q 120 48 138 75" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Smile Mouth -->
    <path d="M 80 88 Q 90 98 100 88" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <text x="90" y="132" class="title-text">Happy</text>
    <text x="90" y="146" class="sub-text">"happy"</text>
  </g>

  <!-- ==================== 3. SURPRISED ==================== -->
  <g transform="translate(450, 20)">
    <rect width="180" height="120" class="module-pcb"/>
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Eyes: Big round surprised eyes + O mouth -->
    <circle cx="58" cy="62" r="19" class="oled-pixel"/>
    <circle cx="58" cy="62" r="6" class="oled-pupil"/>
    <circle cx="122" cy="62" r="19" class="oled-pixel"/>
    <circle cx="122" cy="62" r="6" class="oled-pupil"/>
    <ellipse cx="90" cy="90" rx="6" ry="7" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <text x="90" y="132" class="title-text">Surprised</text>
    <text x="90" y="146" class="sub-text">"surprised"</text>
  </g>

  <!-- ==================== 4. LOVE ==================== -->
  <g transform="translate(660, 20)">
    <rect width="180" height="120" class="module-pcb"/>
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Eyes: Heart Eyes -->
    <path d="M 60 76 L 46 60 A 9 9 0 0 1 60 48 A 9 9 0 0 1 74 60 Z" class="oled-pixel"/>
    <path d="M 120 76 L 106 60 A 9 9 0 0 1 120 48 A 9 9 0 0 1 134 60 Z" class="oled-pixel"/>
    <text x="90" y="132" class="title-text">Love</text>
    <text x="90" y="146" class="sub-text">"love"</text>
  </g>

  <!-- ==================== 5. LOOK AT (GAZE) ==================== -->
  <g transform="translate(30, 180)">
    <rect width="180" height="120" class="module-pcb"/>
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Eyes looking Right (look_at) -->
    <rect x="42" y="48" width="36" height="36" rx="6" class="oled-pixel"/>
    <rect x="62" y="58" width="14" height="14" rx="2" class="oled-pupil"/>
    <rect x="102" y="48" width="36" height="36" rx="6" class="oled-pixel"/>
    <rect x="122" y="58" width="14" height="14" rx="2" class="oled-pupil"/>
    <text x="90" y="132" class="title-text">Look Right</text>
    <text x="90" y="146" class="sub-text">look_at(x, y)</text>
  </g>

  <!-- ==================== 6. THINKING ==================== -->
  <g transform="translate(240, 180)">
    <rect width="180" height="120" class="module-pcb"/>
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Asymmetric Inquisitive Eyes -->
    <rect x="42" y="60" width="36" height="18" rx="4" class="oled-pixel"/>
    <rect x="58" y="62" width="12" height="12" rx="2" class="oled-pupil"/>
    <rect x="102" y="46" width="36" height="36" rx="6" class="oled-pixel"/>
    <rect x="120" y="50" width="14" height="14" rx="2" class="oled-pupil"/>
    <text x="90" y="98" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)" text-anchor="middle">...</text>
    <text x="90" y="132" class="title-text">Thinking</text>
    <text x="90" y="146" class="sub-text">"thinking"</text>
  </g>

  <!-- ==================== 7. SLEEP / BLINK ==================== -->
  <g transform="translate(450, 180)">
    <rect width="180" height="120" class="module-pcb"/>
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Closed Horizontal Lines -->
    <rect x="42" y="64" width="36" height="6" rx="3" class="oled-pixel"/>
    <rect x="102" y="64" width="36" height="6" rx="3" class="oled-pixel"/>
    <text x="142" y="44" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glow)">Z</text>
    <text x="150" y="52" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" filter="url(#glow)">z</text>
    <text x="90" y="132" class="title-text">Sleep / Blink</text>
    <text x="90" y="146" class="sub-text">"sleep" / "blink"</text>
  </g>

  <!-- ==================== 8. LISTENING / SPECTRUM ==================== -->
  <g transform="translate(660, 180)">
    <rect width="180" height="120" class="module-pcb"/>
    <rect x="55" y="4" width="70" height="6" fill="#111" rx="1"/>
    <circle cx="65" cy="7" r="2" class="header-pins"/>
    <circle cx="82" cy="7" r="2" class="header-pins"/>
    <circle cx="98" cy="7" r="2" class="header-pins"/>
    <circle cx="115" cy="7" r="2" class="header-pins"/>
    <text x="65" y="18" class="pin-label">GND</text>
    <text x="82" y="18" class="pin-label">VCC</text>
    <text x="98" y="18" class="pin-label">SCL</text>
    <text x="115" y="18" class="pin-label">SDA</text>
    <rect x="15" y="24" width="150" height="85" class="screen-bezel"/>
    <rect x="17" y="26" width="146" height="81" class="screen-glass"/>
    <!-- Sound Waves / Spectrum Equalizer Bars -->
    <rect x="36"  y="80" width="6" height="18" rx="2" class="oled-pixel"/>
    <rect x="46"  y="68" width="6" height="30" rx="2" class="oled-pixel"/>
    <rect x="56"  y="54" width="6" height="44" rx="2" class="oled-pixel"/>
    <rect x="66"  y="44" width="6" height="54" rx="2" class="oled-pixel"/>
    <rect x="76"  y="60" width="6" height="38" rx="2" class="oled-pixel"/>
    <rect x="86"  y="40" width="6" height="58" rx="2" class="oled-pixel"/>
    <rect x="96"  y="52" width="6" height="46" rx="2" class="oled-pixel"/>
    <rect x="106" y="66" width="6" height="32" rx="2" class="oled-pixel"/>
    <rect x="116" y="48" width="6" height="50" rx="2" class="oled-pixel"/>
    <rect x="126" y="72" width="6" height="26" rx="2" class="oled-pixel"/>
    <rect x="136" y="82" width="6" height="16" rx="2" class="oled-pixel"/>
    <text x="90" y="132" class="title-text">Audio Spectrum</text>
    <text x="90" y="146" class="sub-text">show_spectrum()</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #2c3e50; font-weight: 500; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a252f; }
      .pin-label { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #ffffff; font-weight: bold; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#fcfcfc" rx="8"/>
  <rect x="10" y="10" width="780" height="420" fill="none" stroke="#e1e8ed" stroke-width="1.5" rx="6"/>

  <!-- ESP32 Board Graphic -->
  <g transform="translate(50, 70)" filter="url(#shadow)">
    <rect width="150" height="270" rx="8" fill="#1e272e"/>
    <rect x="20" y="55" width="110" height="85" rx="4" fill="#d2dae2" stroke="#808e9b" stroke-width="1.5"/>
    <text x="75" y="95" text-anchor="middle" font-family="sans-serif" font-size="11px" font-weight="bold" fill="#485460">ESP32-WROOM</text>
    <text x="75" y="112" text-anchor="middle" font-family="sans-serif" font-size="9px" fill="#808e9b">WiFi + BLE SoC</text>
    <circle cx="110" cy="75" r="4" fill="#b0bec5"/>
    <rect x="30" y="10" width="90" height="32" rx="3" fill="#000000"/>
    <path d="M 40 38 L 40 20 L 50 20 L 50 35 L 60 35 L 60 20 L 70 20 L 70 35 L 80 35 L 80 20 L 90 20 L 90 35 L 100 35 L 100 20 L 110 20 L 110 38" fill="none" stroke="#f1c40f" stroke-width="2"/>
    <rect x="50" y="250" width="50" height="24" rx="3" fill="#718093" stroke="#2f3640" stroke-width="1"/>
    
    <g fill="#f5f6fa" stroke="#7f8fa6">
      <circle cx="12" cy="70" r="4.5"/><circle cx="12" cy="90" r="4.5"/><circle cx="12" cy="110" r="4.5"/>
      <circle cx="12" cy="130" r="4.5"/><circle cx="12" cy="150" r="4.5"/><circle cx="12" cy="170" r="4.5"/>
      <circle cx="12" cy="190" r="4.5"/><circle cx="12" cy="210" r="4.5"/><circle cx="12" cy="230" r="4.5"/>
      <circle cx="138" cy="70" r="4.5"/><circle cx="138" cy="90" r="4.5"/><circle cx="138" cy="110" r="4.5"/>
      <circle cx="138" cy="130" r="4.5"/><circle cx="138" cy="150" r="4.5"/><circle cx="138" cy="170" r="4.5"/>
      <circle cx="138" cy="190" r="4.5"/><circle cx="138" cy="210" r="4.5"/><circle cx="138" cy="230" r="4.5"/>
    </g>
    <text x="75" y="240" text-anchor="middle" class="pin-label" fill="#f5cd79">ESP32 DevKit</text>
  </g>

  <!-- Pin Callouts -->
  <!-- 5V (Left, cy=230 -> absolute 300) -->
  <g transform="translate(5, 290)">
    <rect width="45" height="20" rx="3" fill="#c0392b"/>
    <text x="22" y="14" text-anchor="middle" class="pin-label">5V</text>
  </g>
  <!-- GND (Left, cy=190 -> absolute 260) -->
  <g transform="translate(5, 250)">
    <rect width="45" height="20" rx="3" fill="#2f3640"/>
    <text x="22" y="14" text-anchor="middle" class="pin-label">GND</text>
  </g>
  <!-- GPIO 21 (SDA) (Right, cy=170 -> absolute 240) -->
  <g transform="translate(190, 230)">
    <rect width="80" height="20" rx="3" fill="#27ae60"/>
    <text x="40" y="14" text-anchor="middle" class="pin-label">GPIO 21 (SDA)</text>
  </g>
  <!-- GPIO 22 (SCL) (Right, cy=190 -> absolute 260) -->
  <g transform="translate(190, 255)">
    <rect width="80" height="20" rx="3" fill="#f39c12"/>
    <text x="40" y="14" text-anchor="middle" class="pin-label">GPIO 22 (SCL)</text>
  </g>

  <!-- 16x2 I2C LCD Graphic -->
  <g transform="translate(420, 160)" filter="url(#shadow)">
    <!-- LCD Module PCB (Green) -->
    <rect width="330" height="150" rx="8" fill="#1b5e20" stroke="#0d3c11" stroke-width="2.5"/>
    <!-- Metal Bezel (Black) -->
    <rect x="25" y="20" width="230" height="85" rx="5" fill="#263238" stroke="#37474f" stroke-width="2"/>
    <!-- LCD Glass Display (Yellow-Green Backlight) -->
    <rect x="35" y="28" width="210" height="68" rx="2" fill="#9ccc65" stroke="#7cb342"/>
    <!-- 16x2 Character Text Simulation -->
    <text x="45" y="52" font-family="'Courier New', Courier, monospace" font-size="14px" font-weight="bold" fill="#1b5e20">Hello, ESPZero!</text>
    <text x="45" y="76" font-family="'Courier New', Courier, monospace" font-size="14px" font-weight="bold" fill="#1b5e20">16x2 I2C Display</text>

    <!-- Contrast Trimpot (Blue Potentiometer on back/side) -->
    <rect x="275" y="25" width="25" height="25" rx="2" fill="#1976d2" stroke="#0d47a1"/>
    <circle cx="287.5" cy="37.5" r="7" fill="#e0e0e0"/>
    <line x1="284" y1="37.5" x2="291" y2="37.5" stroke="#424242" stroke-width="2"/>
    <text x="287.5" y="60" text-anchor="middle" font-size="8px" fill="#ecf0f1">명암조절</text>

    <!-- I2C Backpack 4-Pin Header (Right) -->
    <g transform="translate(275, 75)">
      <rect width="45" height="55" rx="3" fill="#212121" stroke="#424242"/>
      <circle cx="12" cy="12" r="3.5" fill="#2c3e50"/><text x="22" y="15" font-size="9px" font-weight="bold" fill="#bdc3c7">GND</text>
      <circle cx="12" cy="24" r="3.5" fill="#c0392b"/><text x="22" y="27" font-size="9px" font-weight="bold" fill="#ff7675">VCC</text>
      <circle cx="12" cy="36" r="3.5" fill="#27ae60"/><text x="22" y="39" font-size="9px" font-weight="bold" fill="#2ecc71">SDA</text>
      <circle cx="12" cy="48" r="3.5" fill="#f39c12"/><text x="22" y="51" font-size="9px" font-weight="bold" fill="#f1c40f">SCL</text>
    </g>

    <text x="140" y="-10" text-anchor="middle" class="title">I2C LCD 디스플레이 (16x2)</text>
  </g>

  <!-- Wires -->
  <!-- 5V -> VCC -->
  <path d="M 50 300 L 25 300 L 25 385 L 707 385 L 707 249" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <!-- GND -> GND -->
  <path d="M 50 260 L 35 260 L 35 370 L 695 370 L 695 247" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <!-- SDA (GPIO 21) -> SDA -->
  <path d="M 270 240 L 400 240 L 400 330 L 719 330 L 719 271" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
  <!-- SCL (GPIO 22) -> SCL -->
  <path d="M 270 265 L 380 265 L 380 345 L 731 345 L 731 283" fill="none" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>

  <!-- Info Box -->
  <g transform="translate(360, 40)">
    <rect width="410" height="90" rx="6" fill="#f8f9fa" stroke="#ced6e0" stroke-width="1"/>
    <text x="15" y="24" class="title" font-size="14px">I2C LCD 디스플레이 연결도</text>
    <circle cx="22" cy="44" r="5" fill="#c0392b"/>
    <text x="35" y="48" class="label" font-size="12px">5V (VIN) → LCD VCC</text>
    <circle cx="22" cy="58" r="5" fill="#2c3e50"/>
    <text x="35" y="62" class="label" font-size="12px">GND → LCD GND</text>
    <circle cx="22" cy="72" r="5" fill="#27ae60"/>
    <text x="35" y="76" class="label" font-size="12px">GPIO 21 (I2C SDA) → LCD SDA</text>
    <circle cx="22" cy="86" r="5" fill="#f39c12"/>
    <text x="35" y="90" class="label" font-size="12px">GPIO 22 (I2C SCL) → LCD SCL</text>
  </g>
</svg>
